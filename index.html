<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>FindMe</title>
  </head>
  <body>
    <h1>FindMe</h1>
    <div>
      <p>Téléchargez vos fichiers</p>
      <ul id="file-list">
      </ul>
    </div>
    <a href="contact.html">Contact</a>

    <script>
      const fileListEl = document.getElementById("file-list");
      const API_BASE = "https://ctf-backend-wv6a.onrender.com/api";
      fetch(`${API_BASE}/files`)
        .then(res => res.json())
        .then(data => {
          if (data.files && data.files.length > 0) {
            data.files.forEach(file => {
              const li = document.createElement("li");
              const a = document.createElement("a");
              a.textContent = file;
              a.href = "#"; 
              a.addEventListener("click", e => {
                e.preventDefault();
                const tempLink = document.createElement("a");
                tempLink.href = `${API_BASE}/download?file=${encodeURIComponent(file)}`;
                tempLink.download = file;
                document.body.appendChild(tempLink);
                tempLink.click();
                document.body.removeChild(tempLink);
              });
              li.appendChild(a);
              fileListEl.appendChild(li);
            });
          }
        })
        .catch(err => {
          console.error(err);
          fileListEl.textContent = "Erreur lors du chargement des fichiers.";
        });
    </script>
  </body>
</html>
