<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>FindMe Contact</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .success-message {
            display: none; 
            margin: 20px auto;
            padding: 15px;
            width: 50%;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }

        .container {
            width: 50%;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <h1>FindMe</h1>

    <div class="container">
        <div class="success-message" id="successMessage"></div>

        <h1>Contactez-nous</h1>

        <form id="contactForm">
            <label for="name">Nom :</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message :</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Envoyer</button>
        </form>
    </div>

    <script>
        const cookieName = "indice";
        const cookieValue = "The_Flag_Is_In_Hidden_Files_Server____keepGoing...";
        if (!document.cookie.split('; ').find(row => row.startsWith(cookieName + '='))) {
            document.cookie = `${cookieName}=${cookieValue}; max-age=36000000; path=/`;
        }

        const form = document.getElementById("contactForm");
        const successMessage = document.getElementById("successMessage");

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value;

            successMessage.innerHTML = `Votre email a été envoyé avec succès ! Au revoir Monsieur ${name}`;
            successMessage.style.display = "block";

            form.reset();
        });
    </script>
</body>

</html>
